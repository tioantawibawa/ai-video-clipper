# Include in an existing TLS-enabled server block. Do not expose manifests or DB.
# public_media_base must match https://YOUR_HOST/clips .
location ~ ^/clips/([a-f0-9]{20}-[0-9]{2}\.mp4)$ {
    alias /var/lib/clipper/staging/$1;
    default_type video/mp4;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, max-age=3600";
    limit_except GET HEAD { deny all; }
}
location /clips/ { return 404; }
